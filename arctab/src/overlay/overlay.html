<!doctype html>
<html lang="en" class="ready">
<head>
  <meta charset="utf-8">
  <title>ArcTab search</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="overlay cmd-open">
  <!-- Arc-style command bar: appears over a blurred homepage once you start typing. -->
  <div id="cmd-backdrop">
    <div id="cmd" role="dialog" aria-label="Search">
      <div class="cmd-row">
        <svg class="cmd-ico" viewBox="0 0 16 16" width="18" height="18"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="kw-pill" class="hidden"><img alt="" width="16" height="16"><span></span></span>
        <input id="search" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search">
        <button id="incog" type="button" title="Open in an incognito window (⌥⌘N)" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5.5 11l1.6-5.4a1.5 1.5 0 0 1 1.9-1l3 .9 3-.9a1.5 1.5 0 0 1 1.9 1L18.5 11"/><circle cx="7.5" cy="16" r="2.8"/><circle cx="16.5" cy="16" r="2.8"/><path d="M10.3 16h3.4"/></svg><span>Incognito</span></button>
      </div>
      <div id="suggest" class="hidden" role="listbox"></div>
    </div>
    <nav id="so-favs" class="fav-strip"></nav>
    <div id="ov-updates" class="upd-list" aria-label="Updates"></div>
  </div>


  <!-- Plain scripts sharing globals, like the new tab page. -->
  <script src="overlay.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../../local/config.local.js"></script>
  <script src="../shared/config.merge.js"></script>
  <script src="../shared/shared.js"></script>
  <script src="overlay-shortcuts.js"></script>
  <script src="../newtab/omnibox.js"></script>
</body>
</html>
