set-window-option -g mode-keys vi
setw -g aggressive-resize on
set-option -g detach-on-destroy off
# Enable the terminal title update
set-option -g set-titles on

# Set the title format to "tmux: session:window"
set-option -g set-titles-string "tmux: #S:#W @ #h"

# Show session name, window name, and hostname on each pane border
set-option -g pane-border-status top
set-option -g pane-border-format " #{session_name} | #{window_name} : #{pane_current_command} "

set -g visual-bell off
set -g bell-action any
set -g allow-passthrough on

# Modified-key reporting, needed for Alt+Enter (and friends) to survive the trip
# through tmux. Without it the modifier is dropped and Alt+Enter arrives as a
# bare CR, indistinguishable from Enter -- which breaks newline-insert in TUIs
# like Claude Code. Only noticeable when tmux runs on a remote box you ssh into,
# since a local iTerm2 -> app path has no tmux in between to drop it.
#
# All three are required: extkeys tells tmux the outer terminal understands the
# sequences (the default feature set for xterm* omits it), so without it tmux
# never asks iTerm2 to send them in the first place. csi-u picks the CSI 13;3u
# encoding over the default xterm modifyOtherKeys form.
#
# These are server options (-s), so a `tmux source` applies them to an already
# running server -- but a server started before this block existed will not have
# them until then. Keep above the tpm `run` line so a plugin can't preempt it.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Status bar theme: flat dark-green bar with white text. The ENTIRE bar turns yellow when prefix (Ctrl+b) is pressed.
set -g status-style "#{?client_prefix,fg=colour22 bg=colour220,fg=colour255 bg=colour22}"
set -g status-left "#{?client_prefix,#[fg=colour22]#[bg=colour220]#[bold] #S #[nobold],#[fg=colour255]#[bg=colour22] #S }"
set -g status-right "#{?client_prefix,#[fg=colour22]#[bg=colour220]#[bold] PREFIX ,#[fg=colour255]#[bg=colour22]}"
set -g window-status-style "#{?client_prefix,fg=colour22 bg=colour220,fg=colour255 bg=colour22}"
set -g window-status-current-style "#{?client_prefix,fg=colour22 bg=colour220 bold,fg=colour255 bg=colour22 bold}"
set -g window-status-separator " "

# Resize-pane command aliases (use in command prompt: prefix + :)
set -s command-alias[10] rpd='resize-pane -D'
set -s command-alias[11] rpu='resize-pane -U'
set -s command-alias[12] rpl='resize-pane -L'
set -s command-alias[13] rpr='resize-pane -R'
set -s command-alias[14] rename='select-pane -T'

# prefix + @ : rename the current pane's title (pre-filled with current title)
bind @ command-prompt -I "#{pane_title}" -p "pane title:" "select-pane -T '%%'"

# prefix + f : fuzzy window switcher across all sessions (requires fzf on PATH)
# The popup can't tell which window it was opened from -- a popup counts as a
# window in its session and takes over the window_active flag. display-popup
# doesn't expand #{} formats, but run-shell does, so the pane id is handed over
# in a file first. run-shell here uses only a shell builtin: it inherits the
# server's PATH, which may find a /usr/bin/tmux too old for display-popup.
bind f run-shell 'printf %s "#{pane_id}" > "$HOME/.tmux/window-picker.from"' \; display-popup -E -h "60%" -w "80%" "~/.tmux/window-picker.sh"

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore session automatically on tmux start
set -g @continuum-restore 'on'
# Save every 15 minutes
set -g @continuum-save-interval '15'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

