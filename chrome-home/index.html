<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="style.css">
  <script src="focus.js"></script>
</head>
<body>
  <main>
    <header>
      <div id="clock"></div>
      <div id="date"></div>
    </header>
    <button id="cmd-open" type="button">
      <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Search</span><kbd>⌘K</kbd>
    </button>
    <nav id="favorites"></nav>
    <section id="sections"></section>
    <div id="footer">
      <button id="add-section" type="button">+ New section</button>
      <span id="col-ctrl">Columns
        <button id="col-minus" type="button" title="Fewer columns">−</button>
        <b id="col-count"></b>
        <button id="col-plus" type="button" title="More columns">+</button>
      </span>
      <a id="manage" href="#">Open in bookmark manager</a>
    </div>
  </main>

  <!-- Arc-style command bar: appears over a blurred homepage once you start typing. -->
  <div id="cmd-backdrop">
    <div id="cmd" role="dialog" aria-label="Search">
      <div class="cmd-row">
        <svg class="cmd-ico" viewBox="0 0 16 16" width="18" height="18"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="kw-pill" class="hidden"><img alt="" width="16" height="16"><span></span></span>
        <input id="search" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search">
      </div>
      <div id="suggest" class="hidden" role="listbox"></div>
    </div>
  </div>

  <dialog id="editor">
    <form method="dialog">
      <h3 id="ed-heading"></h3>
      <label>Name <input name="title" autocomplete="off"></label>
      <label id="ed-url-row">URL <input name="url" autocomplete="off" spellcheck="false"></label>
      <label id="ed-emoji-row">Icon <span class="hint">emoji, optional · ⌃⌘Space to pick</span>
        <input name="emoji" autocomplete="off" placeholder="Leave empty to use the site's icon"></label>
      <menu>
        <button value="ok" class="primary">Save</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" class="hidden"><span></span><button type="button">Undo</button></div>

  <script src="config.js"></script>
  <script src="config.local.js"></script>
  <script src="config.merge.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script src="omnibox.js"></script>
</body>
</html>
